<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="container">
        
        <h1>Student Management</h1>
        
        <a href="{{ url_for('add_student') }}">Add Student</a>

    <br><br>

    <table>

        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Course</th>
        </tr>
            {% for student in students %}

        <tr>
            <td>{{ student["id"] }}</td>
            <td>{{ student["name"] }}</td>
            <td>{{ student["email"] }}</td>
            <td>{{ student["course"] }}</td>

            <td>
                <a class="update" href="{{ url_for('update_student', id=student['id'] )}}">
                    <button type="submit">Update</button> 
                </a>

            <form action="{{ url_for('delete_student', id=student['id'])}}"
            method="POST"
            style="display:inline">
                
                <br><br>
            <button type="submit" onclick="return  confirm('Delete this student?')">
                Delete
            </button>
        </form>
            </td>
        </tr>

        {% else %}
        <tr>
            <td>No students found.</td>
        </tr>
        {% endfor %}

        </table>
    </div>
</body>
</html>
